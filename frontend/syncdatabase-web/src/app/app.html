<div class="app-shell">
  <aside class="sidebar">
    <a class="brand brand-link" routerLink="/overview" aria-label="SyncDatabase, visão geral">
      <div class="brand-mark">
        <svg viewBox="0 0 40 40" fill="none">
          <ellipse cx="20" cy="9" rx="12" ry="5" stroke="currentColor" stroke-width="2"/>
          <path d="M8 9V28C8 31 13.4 34 20 34C26.6 34 32 31 32 28V9" stroke="currentColor" stroke-width="2"/>
          <path d="M8 18C8 21 13.4 24 20 24C26.6 24 32 21 32 18" stroke="currentColor" stroke-width="2"/>
          <path d="M8 27C8 30 13.4 33 20 33" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div class="brand-copy">
        <strong>SyncDatabase</strong>
        <span>DATA OPERATIONS</span>
      </div>
    </a>

    <div class="workspace-label">WORKSPACE</div>
    <nav class="navigation" aria-label="Navegação principal">
      <a class="nav-link" routerLink="/overview" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{exact: true}">
        <span class="nav-icon">▦</span><span>Visão geral</span>
      </a>
      <a class="nav-link" routerLink="/compare" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon">⇄</span><span>Comparar bancos</span>
      </a>
      <a class="nav-link" routerLink="/tables" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon">▤</span><span>Explorador de tabelas</span>
      </a>
      <a class="nav-link" routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon">◷</span><span>Histórico de execuções</span>
      </a>
    </nav>

    <div class="workspace-label config-label">ADMINISTRAÇÃO</div>
    <nav class="navigation" aria-label="Administração">
      <a class="nav-link" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon">⚙</span><span>Configurações</span>
      </a>
    </nav>

    <div class="sidebar-spacer"></div>
    <div class="sidebar-system">
      <span class="system-indicator"></span>
      <div><strong>Modo diagnóstico</strong><span>Conexões somente leitura</span></div>
    </div>
    <div class="user-profile">
      <div class="avatar">SD</div>
      <div class="user-copy"><strong>Administrador</strong><span>Ambiente local</span></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb"><span>SyncDatabase</span><span class="breadcrumb-separator">/</span><strong>Workspace</strong></div>
      <div class="topbar-right">
        <span class="environment-chip"><span class="small-dot"></span>DESENVOLVIMENTO</span>
        <div class="topbar-divider"></div>
        <span class="topbar-date">POSTGRESQL · SOMENTE LEITURA</span>
      </div>
    </header>
    <router-outlet />
  </main>
</div>
